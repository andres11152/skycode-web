name: CI

# `verify` corre en cada push/PR: es rápido (sin Postgres) y atrapa la
# mayoría de errores (tipos, lint, lógica pura, que el build no rompa).
# `integration-e2e` depende de `verify` (fail-fast, no gasta minutos de CI
# en una base de datos si lo básico ya está roto) y sí necesita Postgres —
# usa un contenedor de servicio con las mismas credenciales de
# docker-compose.test.yml, para poder correr los mismos scripts de
# package.json sin lógica especial de CI.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Tipos, lint, tests unitarios y build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      - name: Lint
        run: npx eslint .

      - name: Tests unitarios
        run: npm test

      - name: Build de producción
        run: npx next build

  integration-e2e:
    name: Tests de integración y E2E
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Mismas credenciales y puerto que docker-compose.test.yml — así los
    # scripts de package.json (que leen .env.test) funcionan sin cambios.
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: skycode_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d skycode_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      # Doble S3-compatible de lib/storage.ts (Cloudflare R2 en producción)
      # — mismas credenciales que docker-compose.test.yml/.env.test. Imagen
      # `bitnamilegacy/minio` en vez de `minio/minio` SOLO acá: los
      # "services" de GitHub Actions no aceptan un `command:` propio como
      # docker-compose, y esta imagen arranca el server automáticamente
      # leyendo MINIO_ROOT_USER/PASSWORD sin necesitar pasar `server /data`
      # a mano. `bitnamilegacy/*` (no `bitnami/*`, que Broadcom restringió a
      # clientes de pago en 2025 — la imagen bajo ese nombre dejó de existir
      # en Docker Hub, causa real de que este job estuviera fallando en
      # silencio) es el namespace donde Bitnami sigue publicando builds
      # gratuitas de sus imágenes legacy. El bucket lo crea
      # scripts/ensure-test-bucket.mjs vía los hooks
      # pretest:integration/pretest:e2e, sin paso propio de CI.
      minio:
        image: bitnamilegacy/minio:latest
        env:
          MINIO_ROOT_USER: test-access-key
          MINIO_ROOT_PASSWORD: test-secret-key
        ports:
          - 9000:9000
        options: >-
          --health-cmd "curl -f http://localhost:9000/minio/health/live"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Aplicar migraciones a la base de test
        run: npm run test:db:migrate

      - name: Tests de integración
        run: npm run test:integration

      - name: Tests E2E
        run: npm run test:e2e

  # Gate de SEO: construye el sitio, lo sirve y corre `npm run seo:check` contra su sitemap. BLOQUEA el merge
  # (marca este job como check obligatorio en la protección de la rama) si alguna URL tiene: título duplicado o de
  # más de 60 caracteres, H1 ausente o múltiple, canonical que no apunta a sí misma, la keyword primaria del
  # mapa de keywords (src/seo/keyword-map.ts) fuera de su título o H1, o hreflang distinto del sitemap.
  #
  # Los posts del blog viven en Postgres, así que se carga la base con los mismos scripts de contenido que se
  # corren en producción (en el mismo orden): sin ellos el sitemap no traería los artículos y el gate no vería
  # los títulos de la guía ni los slugs nativos. Los casos del portafolio no se cargan (necesitan el bucket de
  # imágenes), así que el gate cubre todo lo demás; la auditoría diaria del cron sí recorre el sitio completo.
  seo-gate:
    name: Gate de SEO (seo:check sobre el build)
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: skycode_test
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U test -d skycode_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - name: Migraciones y contenido del blog
        run: |
          npm run test:db:migrate
          for script in seed-articles-from-json seo-legacy-migration-cluster seo-legacy-guide-reframe seo-blog-internal-links seo-outsourcing-post-meta seo-localized-slugs; do
            echo "== $script"
            node --env-file=.env.test "scripts/$script.mjs"
          done

      - name: Build, servir y auditar el sitemap
        run: |
          set -a
          . ./.env.test
          set +a
          npx next build
          npx next start -p 3200 > next-start.log 2>&1 &
          for i in $(seq 1 60); do
            curl -sf http://localhost:3200/login > /dev/null && break
            sleep 1
          done
          BASE_URL=http://localhost:3200 npm run seo:check

      - name: Log del servidor (si algo falló)
        if: failure()
        run: cat next-start.log || true
