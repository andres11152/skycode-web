# Postgres desechable para tests de integración/E2E — nunca la base de
# producción (Render). Puerto 5433 para no chocar con un Postgres local
# en el 5432 por defecto. `down -v` en package.json borra el volumen: cada
# corrida de test arranca de un esquema limpio vía `npm run test:db:migrate`.
services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: skycode_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d skycode_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data

  # Doble S3-compatible desechable para los tests de integración/E2E de
  # lib/storage.ts (Cloudflare R2 en producción, ver ese archivo) — MinIO
  # habla el mismo protocolo S3 que R2, así que el SDK real
  # (@aws-sdk/client-s3) le pega en vez de mockearlo, igual que Postgres
  # arriba es el motor real y no un doble en memoria. Puerto 9000 (API) +
  # 9001 (consola web, no usada por los tests, solo para depurar a mano).
  test-r2:
    image: minio/minio:latest
    command: server /data
    environment:
      MINIO_ROOT_USER: test-access-key
      MINIO_ROOT_PASSWORD: test-secret-key
    ports:
      - "9000:9000"
      - "9001:9001"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /data
