# Postgres desechable para tests de integración/E2E — nunca la base de
# producción (Render). Puerto 5433 para no chocar con un Postgres local
# en el 5432 por defecto. `down -v` en package.json borra el volumen: cada
# corrida de test arranca de un esquema limpio vía `npm run test:db:migrate`.
services:
  test-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: test
      POSTGRES_PASSWORD: test
      POSTGRES_DB: skycode_test
    ports:
      - "5433:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d skycode_test"]
      interval: 1s
      timeout: 3s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data
